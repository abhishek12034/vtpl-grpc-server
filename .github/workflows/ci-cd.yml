name: CI/CD Pipeline

on:
  push:
    branches:
      - updating-with-two-rpc  # Adjust the branch as needed
  pull_request:
    branches:
      - updating-with-two-rpc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to server
        uses: appleboy/ssh-action@latest  # Keep this as is
        with:
          host: ${{ secrets.SERVER_IP }}  # Your server IP in GitHub secrets
          username: ${{ secrets.SERVER_USER }}  # Your server username in secrets
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Your SSH private key in secrets
          script: |
            cd /home/vadmin/python-grpc-server  # Go to the project folder on the server
            git pull origin updating-with-two-rpc  # Pull the latest changes from your branch
            pip install -r requirements.txt  # Reinstall dependencies
            systemctl restart myproject.service  # Restart the service
